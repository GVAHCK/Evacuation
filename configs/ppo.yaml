# PPO Algorithm Configuration & Curriculum Learning Stages

algorithm: "PPO"

hyperparameters:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 64
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 50000

policy:
  net_arch:
    pi: [128, 128]
    vf: [128, 128]

curriculum:
  stages:
    - stage: 1
      name: "Normal Traffic (No Hazard)"
      timesteps: 10000
      traffic_level: "normal"
      hazard_intensity_multiplier: 0.0
    - stage: 2
      name: "Light Hazard"
      timesteps: 10000
      traffic_level: "normal"
      hazard_intensity_multiplier: 0.3
    - stage: 3
      name: "Medium Hazard"
      timesteps: 10000
      traffic_level: "normal"
      hazard_intensity_multiplier: 0.6
    - stage: 4
      name: "Heavy Hazard"
      timesteps: 10000
      traffic_level: "morning_peak"
      hazard_intensity_multiplier: 1.0
    - stage: 5
      name: "Randomized Disasters"
      timesteps: 10000
      traffic_level: "random"
      hazard_intensity_multiplier: "random"

logging:
  tensorboard_log: "logs/ppo_tensorboard"
  checkpoint_freq: 5000
  eval_freq: 2048
