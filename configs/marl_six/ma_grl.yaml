# MA-GRL: Multi-Agent Graph Reinforcement Learning Configuration
model: "MA-GRL"
family: "marl_six"

agent:
  n_agents: 4
  obs_dim: 34
  act_dim: 4
  node_in_dim: 14
  edge_in_dim: 5
  gnn_hidden_dim: 64
  actor_hidden_dim: 128
  critic_hidden_dim: 128
  actor_lr: 0.0003
  critic_lr: 0.0008
  gamma: 0.98
  tau: 0.005
  buffer_size: 50000
  batch_size: 128

training:
  quick_episodes: 50
  full_episodes: 300
  warmup_steps: 100
  update_freq: 2
  eval_freq: 25
  seeds: [42, 101, 2024, 777, 999]
