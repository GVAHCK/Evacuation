# Master Configuration: Adaptive RL Traffic Digital Twin Evacuation Routing

project:
  name: "RL-Evacuation-Twin"
  version: "1.0.0"
  seed: 42
  seeds: [42, 123, 456, 789, 1000]

network:
  # Configurable bounding box (approx 1.5km x 1.5km urban core for fast, high-density simulation)
  # Default: Urban core in Chennai (IIT Madras / Guindy corridor known for flood evacuation studies)
  north: 13.0050
  south: 12.9850
  east: 80.2450
  west: 80.2250
  network_type: "drive"
  crs: "EPSG:4326"
  osm_file: "data/raw/network.osm"
  net_file: "data/processed/network.net.xml"
  graph_file: "data/processed/road_graph.json"

traffic:
  sim_duration: 3600 # 1 hour
  step_length: 1.0 # seconds per SUMO step
  densities:
    low:
      veh_per_hour: 200
      period: 18.0
    normal:
      veh_per_hour: 500
      period: 7.2
    morning_peak:
      veh_per_hour: 1000
      period: 3.6
    evening_peak:
      veh_per_hour: 1200
      period: 3.0
    heavy:
      veh_per_hour: 1600
      period: 2.25

hazard:
  flood:
    spread_rate: 0.08
    propagation_prob: 0.65
    elevation_sensitivity: 0.5
    degradation_threshold: 0.35 # Intensity >= 0.35 -> degraded (speed reduced)
    closure_threshold: 0.70     # Intensity >= 0.70 -> closed (impassable)
  fire:
    spread_rate: 0.10
    wind_direction: 45.0        # degrees (Northeast)
    wind_strength: 5.0          # m/s
    vegetation_factor: 0.6
    degradation_threshold: 0.30
    closure_threshold: 0.65

scenarios:
  n_train: 1000
  n_val: 200
  n_test: 100
  output_dir: "data/generated"

environment:
  max_episode_steps: 60
  time_step_duration: 5.0 # SUMO seconds per RL step
  max_neighbors: 4        # Discrete action space size (matches road network max degree)
  reward:
    progress_weight: 4.0
    arrival_bonus: 100.0
    hazard_penalty_weight: 4.0
    closure_penalty: 25.0
    congestion_penalty_weight: 1.5
    delay_penalty: 0.5
    dead_end_penalty: 30.0
    timeout_penalty: 40.0

evaluation:
  n_eval_episodes: 100
  deterministic: true
  save_trajectories: true
