# Configuration: Model 2 - RecurrentMaskablePPO (LSTM)
model:
  name: "RecurrentMaskablePPO"
  version: "1.0.0"

lstm:
  obs_dim: 34
  action_dim: 4
  hidden_dim: 64
  lstm_hidden_dim: 64

hyperparameters:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  quick_timesteps: 5000
  full_timesteps: 50000
  rollout_steps: 256
  seeds: [42, 101, 2024, 777, 999]
