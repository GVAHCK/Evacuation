# Configuration: Model 3 - GNN-QRDQN
model:
  name: "GNN-QRDQN"
  version: "1.0.0"

gnn:
  features_dim: 64
  hidden_dim: 64
  num_layers: 2
  candidate_feature_dim: 5
  num_candidates: 4

policy:
  net_arch: [64, 64]

hyperparameters:
  n_quantiles: 25
  learning_rate: 1.0e-4
  buffer_size: 25000
  learning_starts: 500
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  target_update_interval: 1000
  exploration_fraction: 0.2
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  max_grad_norm: 10.0

training:
  quick_timesteps: 5000
  full_timesteps: 50000
  seeds: [42, 101, 2024, 777, 999]
