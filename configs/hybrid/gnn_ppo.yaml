# Configuration: Model 1 - GNN-MaskablePPO
model:
  name: "GNN-MaskablePPO"
  version: "1.0.0"

gnn:
  features_dim: 64
  hidden_dim: 64
  num_layers: 2
  candidate_feature_dim: 5
  num_candidates: 4

policy:
  net_arch:
    pi: [64, 64]
    vf: [64, 64]

hyperparameters:
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 64
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  quick_timesteps: 5000
  full_timesteps: 50000
  seeds: [42, 101, 2024, 777, 999]
